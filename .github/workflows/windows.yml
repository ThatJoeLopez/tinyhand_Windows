name: Windows

on:
  push:
    branches: [main]
    tags: ['win-v*']
    paths:
      - 'windows/**'
      - 'assets/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'assets/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish windows/TinyHand/TinyHand.csproj -c Release -r ${{ matrix.rid }} `
            --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none -o out/TinyHand
          Get-ChildItem out/TinyHand | Format-Table Name, Length

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path out/TinyHand -DestinationPath TinyHand-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TinyHand-${{ matrix.rid }}
          path: TinyHand-${{ matrix.rid }}.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/win-v')
        uses: softprops/action-gh-release@v2
        with:
          files: TinyHand-${{ matrix.rid }}.zip
